monitor=,preferred,auto,1

general {
    # Deterministic compositor-owned decoration used by the render probe.
    # The client areas never use this color, so screenshot correlation can
    # isolate Hyprland's border independently from client pixels.
    border_size = 8
    col.active_border = rgba(ff00ffff)
    col.inactive_border = rgba(ff00ffff)
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

debug {
    disable_logs = false

    # Damage logging is consumed by the dedicated render-offset probe. It
    # proves that presentation-offset apply/reset reaches Hyprland's native
    # monitor-damage path instead of relying on a later client repaint.
    enable_stdout_logs = true
    log_damage = true
}
