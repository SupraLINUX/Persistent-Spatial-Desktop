name: build

concurrency:
  group: psd-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ubuntu-26-04:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
      - name: Install shell build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-wayland \
            liblayershellqtinterface-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate integration scripts
        run: bash -n tests/integration/*.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  hyprland-plugin-26-04:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
      - name: Install plugin build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            build-essential \
            cmake \
            ninja-build \
            pkgconf \
            hyprland-dev \
            libgles-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure plugin build
        run: >-
          cmake -S . -B build-plugin -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPSD_BUILD_SHELL=OFF
          -DPSD_BUILD_HYPRLAND_PLUGIN=ON
          -DBUILD_TESTING=OFF

      - name: Build plugin
        run: cmake --build build-plugin --target psd-hyprland-plugin --parallel 2

