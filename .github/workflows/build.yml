name: build

concurrency:
  group: psd-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ubuntu-26-04:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
      - name: Install shell build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-wayland \
            liblayershellqtinterface-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate integration scripts
        run: |
          bash -n tests/integration/*.sh
          if grep -nF '\\${' tests/integration/probe-hardware-nvidia.sh; then
            echo "hardware probe contains escaped parameter expansion" >&2
            exit 1
          fi
          bash tests/integration/test-probe-live-session-mock.sh
          bash tests/integration/test-probe-hardware-nvidia-mock.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  hyprland-plugin-26-04:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
      - name: Install plugin build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            build-essential \
            cmake \
            ninja-build \
            pkgconf \
            hyprland-dev \
            libgles-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure plugin build
        run: >-
          cmake -S . -B build-plugin -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPSD_BUILD_SHELL=OFF
          -DPSD_BUILD_HYPRLAND_PLUGIN=ON
          -DBUILD_TESTING=OFF

      - name: Build plugin
        run: cmake --build build-plugin --target psd-hyprland-plugin --parallel 2

  ubuntu-26-04-qemu:
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU host dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cloud-image-utils \
            curl \
            libgl1-mesa-dri \
            openssh-client \
            ovmf \
            qemu-system-gui \
            qemu-system-x86 \
            qemu-utils

      - name: Cache Ubuntu Minimal 26.04 image
        uses: actions/cache@v4
        with:
          path: ~/.cache/psd-vm
          key: ubuntu-26.04-minimal-cloudimg-amd64-20260827

      - name: Validate VM integration scripts
        run: bash -n tests/integration/*.sh

      - name: Run Ubuntu 26.04 VM integration
        run: bash tests/integration/run-qemu-vm.sh

      - name: Upload QEMU diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: psd-qemu-vm-diagnostics
          path: |
            ${{ runner.temp }}/psd-qemu-vm/qemu.log
            ${{ runner.temp }}/psd-qemu-vm/qemu-serial.log
          if-no-files-found: ignore
